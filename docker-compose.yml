services:
  # ==========================================
  # Service 1: Local MongoDB Database
  # ==========================================
  mongo:
    image: mongo:7-jammy
    container_name: blog-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # Service 2: Express Blog API
  # ==========================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blog-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongo:27017/blogdb
      - JWT_SECRET=supersecretproductionjwtsecret_change_me
      - ALLOWED_ORIGINS=http://localhost:3000
    depends_on:
      mongo:
        condition: service_healthy

# ==========================================
# Persistent Storage (Survives container restarts)
# ==========================================
volumes:
  mongo_data:
