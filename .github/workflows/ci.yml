name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check & compile TypeScript
        run: npm run build

      - name: Run automated test suite (Vitest + MongoMemoryServer)
        run: npm test

      - name: Validate Docker build
        run: docker build -t blog-api:ci .